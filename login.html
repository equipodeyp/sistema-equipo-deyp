  <!-- === LÓGICA DE JAVASCRIPT === -->
<script>
  window.addEventListener("DOMContentLoaded", () => {
    // 1. CONTROL DEL MODAL (30 SEGUNDOS)
    let tiempoRestante = 20;
    const elementoContador = document.getElementById("contador");
    const modal = document.getElementById("miModalAlerta");

    const intervalo = setInterval(() => {
      tiempoRestante--;
      if (elementoContador) {
        elementoContador.textContent = `Este aviso se cerrará en ${tiempoRestante}s`;
      }

      if (tiempoRestante <= 0) {
        clearInterval(intervalo);
        if (modal) {
          modal.style.display = "none";
        }
      }
    }, 1000);

    // 2. REFRESCAR LA PÁGINA COMPLETA EN 10 MINUTOS
    // 10 minutos = 10 * 60 * 1000 = 600,000 milisegundos
    setTimeout(() => {
      window.location.reload();
    }, 600000);
  });
</script>
