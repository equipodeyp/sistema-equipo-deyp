  <!-- SCRIPT DE VERIFICACIÓN CONTINUA (BUCLE DE RETORNO AUTOMÁTICO) -->
  <script>
    function verificarEstadoSistema() {
        // Consultamos al servidor usando una marca de tiempo dinámica para romper la caché de red
        fetch('mantenimiento.php?antiCache=' + Date.now())
            .then(response => response.json())
            .then(data => {
                if (data.mantenimiento === true) {
                    // Si el servidor confirma mantenimiento y la pantalla aún no es gris, la bloqueamos
                    if (document.body.className !== "mantenimiento-activo") {
                        document.body.className = "mantenimiento-activo";
                        document.body.innerHTML = `
                            <div style="text-align: center; background-color: rgba(0, 0, 0, 0.25); padding: 40px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); max-width: 500px; width: 90%;">
                                <h1 style="font-size: 2.2em; margin-bottom: 15px; font-weight: bold;">Plataforma en Mantenimiento</h1>
                                <p style="font-size: 1.1em; color: #e9ecef; line-height: 1.6;">Actualmente se están realizando actualizaciones programadas en nuestro servidor para mejorar la estabilidad del entorno de trabajo.</p>
                                <p style="font-size: 0.95em; color: #ced4da; margin-top: 20px; font-weight: bold;">El servicio se restablecerá automáticamente a las 13:00 hrs. Agradecemos su comprensión.</p>
                            </div>
                        `;
                    }
                } else {
                    // SI YA NO HAY MANTENIMIENTO:
                    // Si la pantalla estaba bloqueada (gris) y el servidor da luz verde, forzamos la recarga inmediata
                    if (document.body.className === "mantenimiento-activo") {
                        window.location.reload();
                    }
                }
            })
            .catch(err => console.error("Error en el lazo de control de tiempo:", err));
    }

    // Ejecutamos la verificación apenas se procesa el documento
    document.addEventListener("DOMContentLoaded", function() {
        verificarEstadoSistema();
        // Configura un lazo repetitivo: revisa el estado real cada 5 segundos de manera exacta
        setInterval(verificarEstadoSistema, 5000);
    });
  </script>
